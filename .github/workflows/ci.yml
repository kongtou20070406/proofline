name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Proofline (CPU PyTorch + formal extras)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Run pytest suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: pytest -p no:cacheprovider -v tests
      - name: Verify CLI quickstart
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          proofline --list-gpus
          proofline --model examples/quickstart_models.py:mlp_block examples/quickstart_models.py:transformer_block --input 1,256,512 --gpu rtx5090_measured --dtype bf16 --formal-z3
